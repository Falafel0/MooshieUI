name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

# Windows-only release. The fork ships a single NSIS installer built for
# x86_64-pc-windows-msvc, so the updater manifest (latest.json) carries the
# windows-x86_64 entry and nothing else. The Linux bundles (AppImage/deb/rpm),
# the headless server binary, the Docker image and the macOS job were removed
# on purpose. Re-adding a platform means updating scripts/release_artifacts.py
# as well, because it asserts the exact bundle set it expects to find.
jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Verify release versions
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/verify-release-version.mjs "$RELEASE_TAG"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit Rust dependencies
        run: cargo install cargo-audit --locked && cd src-tauri && cargo audit
        continue-on-error: true

      - name: Build Tauri app (Windows, NSIS only)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: artifacts-x86_64-pc-windows-msvc
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/
          if-no-files-found: error

  release:
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release scripts and notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Collect installers, updater manifest and checksums
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release_artifacts.py \
            --source artifacts --output release-files --tag "$TAG" --repo "$REPOSITORY"

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Build release body: installer blurb + changelog from RELEASE_NOTES.md
          printf '%s\n' \
            '**One-click installer** — just download and run. The app will automatically install ComfyUI, Python, PyTorch, and everything else you need on first launch.' \
            '' \
            '### Downloads' \
            '| Platform | File |' \
            '|----------|------|' \
            '| **Windows** | `.exe` (NSIS installer) |' \
            '' \
            '---' \
            '' \
            > /tmp/release-body.md

          # Append only this version's section from RELEASE_NOTES.md
          if [ -f RELEASE_NOTES.md ]; then
            # Extract from "## What's New in vX.Y.Z" until the next "---" or next version heading
            sed -n "/^## What's New in ${TAG}/,/^---$/p" RELEASE_NOTES.md | sed '$ { /^---$/d }' >> /tmp/release-body.md
          fi

          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; updating notes and replacing assets."
            gh release edit "${TAG}" \
              --repo "${{ github.repository }}" \
              --title "MooshieUI Fork ${TAG}" \
              --notes-file /tmp/release-body.md
            upload_log="$(mktemp)"
            if ! gh release upload "${TAG}" \
              --repo "${{ github.repository }}" \
              --clobber \
              release-files/* >"${upload_log}" 2>&1; then
              if grep -qi "immutable release" "${upload_log}"; then
                echo "Release ${TAG} is immutable; keeping existing release assets."
              else
                cat "${upload_log}"
                rm -f "${upload_log}"
                exit 1
              fi
            fi
            rm -f "${upload_log}"
          else
            gh release create "${TAG}" \
              --repo "${{ github.repository }}" \
              --title "MooshieUI Fork ${TAG}" \
              --latest \
              --notes-file /tmp/release-body.md \
              release-files/*
          fi
