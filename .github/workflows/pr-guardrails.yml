name: PR Guardrails

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["release/**"]

permissions:
  contents: read

jobs:
  native-windows:
    name: Native Rust (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Desktop compile
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Server compile
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features server
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

  inpaint-cpu:
    name: Inpainting masks (CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/pr-guardrails.yml
      - name: Install pinned CPU tensor runtime
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify mask processing and release artifacts
        run: |
          python -m unittest tests/test_inpainting_workspace.py
          python -m unittest discover -s scripts -p test_release_artifacts.py

  guardrails:
    name: Guardrails (build, i18n, types)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with base for diffing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Prompt Studio workspace regressions
        run: |
          node scripts/test-prompt-studio-workspace.mjs
          node --test tests/prompt-studio-arena.test.mjs
          node scripts/test-prompt-studio-guided.mjs
          node scripts/test-prompt-studio-writing.mjs
          node --test tests/prompt-studio-tools.test.mjs tests/prompt-studio-collections.test.mjs

      - name: i18n parity
        run: node scripts/check-i18n-parity.mjs

      - name: Prompt alternation and desktop UI regressions
        run: |
          node --test tests/prompt-alternation.test.mjs tests/workspace-commands.test.mjs tests/bottom-panel.test.mjs tests/split-encoder-selection.test.mjs tests/generation-layout.test.mjs tests/controlnet-state.test.mjs tests/comfy-ready-wait.test.mjs
          python3 scripts/comfyui-compat/test_prompt_alternation.py

      - name: Release artifact checks
        run: python3 -m unittest discover -s scripts -p test_release_artifacts.py

      - name: Gallery and model inventory regressions
        run: |
          node scripts/test-gallery-refresh.mjs
          node scripts/test-model-availability.mjs
          node --test tests/visible-resource-queue.test.mjs tests/yield-to-ui.test.mjs

      - name: Inpainting lifecycle and mask regression checks
        run: node --test tests/patchy-return-script.test.mjs tests/live-preview-source.test.mjs tests/generation-submit.test.mjs tests/inpaint-result-registry.test.mjs tests/inpainting-chain.test.mjs tests/mask-processing.test.mjs tests/inpaint-compare-pair.test.mjs tests/patchy-mask-import.test.mjs tests/patchy-ux-copy.test.mjs tests/patchy-handoff-effect.test.mjs tests/tauri-wrapper.test.mjs tests/projects-ui.test.mjs tests/regional-mode-separation.test.mjs tests/layer-visualization.test.mjs tests/canvas-transform.test.mjs tests/canvas-render-hotpaths.test.mjs tests/thumbnail-caching.test.mjs tests/denoising.test.mjs tests/inpaint-settings.test.mjs tests/canvas-history-relations.test.mjs tests/layer-relations.test.mjs tests/layer-alpha.test.mjs tests/prepare-controlnet-layers.test.mjs tests/project-guard-reach.test.mjs tests/project-document.test.mjs tests/project-system.test.mjs

      - name: Generation preparation and responsive document regressions
        run: node --test tests/generation-preparation.test.mjs tests/inpaint-layer-snapshot.test.mjs tests/canvas-resize.test.mjs tests/prompt-overlay-viewport.test.mjs tests/value-revision.test.mjs tests/canvas-mask-export.test.mjs

      - name: Compute changed files
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git diff --name-only "origin/$BASE_REF...HEAD" > changed.txt
          echo "Changed files:"; cat changed.txt

      - name: svelte-check (diff-scoped, blocking)
        run: |
          npx svelte-check --output machine > sc.txt 2>&1 || true
          node scripts/svelte-check-diff.mjs --machine sc.txt --changed changed.txt

  a11y-advisory:
    name: a11y advisory (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with base for diffing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Compute changed files
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git diff --name-only "origin/$BASE_REF...HEAD" > changed.txt

      - name: svelte-check a11y -> job summary
        run: |
          npx svelte-check --output machine > sc.txt 2>&1 || true
          node scripts/svelte-check-diff.mjs --machine sc.txt --changed changed.txt --summary a11y.md || true
          cat a11y.md >> "$GITHUB_STEP_SUMMARY" || true
