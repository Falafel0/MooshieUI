name: PR Guardrails

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  native-windows:
    name: Native Rust (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Desktop compile
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Server compile
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features server
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

  guardrails:
    name: Guardrails (build, i18n, types)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with base for diffing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: i18n parity
        run: node scripts/check-i18n-parity.mjs

      - name: Release artifact checks
        run: python3 -m unittest discover -s scripts -p test_release_artifacts.py

      - name: Inpainting lifecycle and mask regression checks
        run: node --test tests/patchy-return-script.test.mjs tests/live-preview-source.test.mjs tests/generation-submit.test.mjs tests/inpaint-result-registry.test.mjs tests/inpainting-chain.test.mjs tests/mask-processing.test.mjs tests/inpaint-compare-pair.test.mjs tests/patchy-mask-import.test.mjs tests/patchy-ux-copy.test.mjs tests/patchy-handoff-effect.test.mjs tests/tauri-wrapper.test.mjs tests/projects-ui.test.mjs tests/regional-mode-separation.test.mjs tests/layer-visualization.test.mjs tests/canvas-transform.test.mjs tests/canvas-render-hotpaths.test.mjs tests/thumbnail-caching.test.mjs tests/project-guard-reach.test.mjs tests/project-document.test.mjs tests/project-system.test.mjs

      - name: Compute changed files
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          echo "Changed files:"; cat changed.txt

      - name: svelte-check (diff-scoped, blocking)
        run: |
          npx svelte-check --output machine > sc.txt 2>&1 || true
          node scripts/svelte-check-diff.mjs --machine sc.txt --changed changed.txt

  a11y-advisory:
    name: a11y advisory (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with base for diffing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Compute changed files
        run: git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt

      - name: svelte-check a11y -> job summary
        run: |
          npx svelte-check --output machine > sc.txt 2>&1 || true
          node scripts/svelte-check-diff.mjs --machine sc.txt --changed changed.txt --summary a11y.md || true
          cat a11y.md >> "$GITHUB_STEP_SUMMARY" || true
