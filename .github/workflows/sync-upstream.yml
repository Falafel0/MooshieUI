name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  merge:
    if: github.repository == 'Falafel0/MooshieUI'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Merge original main into fork
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Mooshieblob1/MooshieUI.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Fork already contains upstream/main."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit --no-ff FETCH_HEAD
          git push origin HEAD:main
